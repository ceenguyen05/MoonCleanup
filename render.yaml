# Game server + REST API. ADR-0029: one free service, deployed from main after CI passes.
# Cee confirms region and browser origins before applying; secrets are supplied in Render.
# Build from repository root for pnpm workspaces. Migrations/seed run in the build command.
# Keep plan: free explicit. Do NOT set maxShutdownDelaySeconds: Render rejects it on free tier (default 30 s SIGTERM grace applies).
# NET_SPIKE is temporary pre-launch test mode, disabled by default; never enable with live players.
# Blueprint field reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: moon-cleanup-server
    runtime: node
    plan: free
    region: ohio # Owner decision 2026-11-13: Ohio, nearest Render region to Texas. Cannot change after creation.
    branch: main
    buildCommand: >-
      npm install --global pnpm@11.28.9 &&
      pnpm install --frozen-lockfile --prod=false --filter "@moon-cleanup/server..." --filter moon-cleanup &&
      pnpm exec turbo run build --filter=@moon-cleanup/server &&
      pnpm --filter @moon-cleanup/db run migrate &&
      pnpm --filter @moon-cleanup/server run seed
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/server/**
        - packages/**
        - pnpm-lock.yaml
        - render.yaml
        - package.json
        - pnpm-workspace.yaml
        - turbo.json
        - tsconfig.base.json
        - .nvmrc
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ENV_NAME
        value: production
      # Neon Free Postgres: paste the DIRECT connection string (no -pooler host, sslmode=require). Same string for the
      # build-time migration and the server. Neon scale-to-zero wakes in ~1-5 s; migrate and the server retry through it.
      - key: DATABASE_URL
        sync: false
      # Optional private-CA PEM. Leave empty for Neon (verified against the system CA store). Never disable TLS verification.
      - key: DATABASE_CA_CERT
        sync: false
      - key: DB_SCHEMA
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      # PLACEHOLDER origin: replace with the real Vercel production origin (no path, no trailing slash) after the
      # first Vercel deploy, here and in the Render dashboard (docs/HOSTING_GUIDE.md section 4).
      - key: ALLOWED_ORIGINS
        value: https://cleanthemoonx.vercel.app
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: SIM_TICK_HZ
        value: "20"
      - key: SNAPSHOT_HZ
        value: "10"
      - key: MAX_ROOMS
        value: "3"
      - key: MAX_SEATS_PER_IP
        value: "6"
      - key: TICK_BUDGET_MS
        value: "3.5"
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      - key: PERSISTENCE_DRIVER
        value: postgres
      - key: DB_POOL_MAX
        value: "4"
      - key: JWT_SECRET_PREVIOUS
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.01"
      - key: MAX_CLIENTS
        value: "12"
      - key: CHECKPOINT_INTERVAL_S
        value: "30"
      # Process-wide checkpoint decompression budget (512 MB / 0.1 CPU free instance): MiB inflated per minute, concurrent, queued.
      - key: CHECKPOINT_INFLATE_MIB_PER_MIN
        value: "32"
      - key: CHECKPOINT_INFLATE_CONCURRENCY
        value: "1"
      - key: CHECKPOINT_INFLATE_QUEUE
        value: "3"
      - key: SEAT_HOLD_S
        value: "60"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Env validation refuses NET_SPIKE=1 while ENV_NAME=production; hosted spike recipe: HOSTING_GUIDE section 5.
      - key: NET_SPIKE
        value: "0"
      # Optional TRANSPORT=auto|uws|ws (default auto: uWebSockets.js, falls back to ws). Not set here; add in the dashboard to force.
