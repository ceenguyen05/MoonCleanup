# Game server + REST API. ADR-0029: one free service, deployed from main after CI passes.
# Cee confirms region and browser origins before applying; secrets are supplied in Render.
# Build from repository root for pnpm workspaces. Migrations/seed run in the build command.
# Keep plan: free explicit. maxShutdownDelaySeconds allows the server to checkpoint on SIGTERM.
# NET_SPIKE is temporary pre-launch test mode, disabled by default; never enable with live players.
# Blueprint field reference: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: moon-cleanup-server
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: >-
      npm install --global pnpm@11.28.9 &&
      pnpm install --frozen-lockfile --prod=false --filter "@moon-cleanup/server..." --filter moon-cleanup &&
      pnpm exec turbo run build --filter=@moon-cleanup/server &&
      pnpm --filter @moon-cleanup/db run migrate &&
      pnpm --filter @moon-cleanup/server run seed
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/server/**
        - packages/**
        - pnpm-lock.yaml
        - render.yaml
        - package.json
        - pnpm-workspace.yaml
        - turbo.json
        - tsconfig.base.json
        - .nvmrc
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ENV_NAME
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: DB_SCHEMA
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://moon-cleanup.vercel.app
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: SIM_TICK_HZ
        value: "20"
      - key: SNAPSHOT_HZ
        value: "10"
      - key: MAX_ROOMS
        value: "3"
      - key: TICK_BUDGET_MS
        value: "3.5"
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      - key: PERSISTENCE_DRIVER
        value: postgres
      - key: DB_POOL_MAX
        value: "4"
      - key: JWT_SECRET_PREVIOUS
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.01"
      - key: MAX_CLIENTS
        value: "24"
      - key: CHECKPOINT_INTERVAL_S
        value: "30"
      - key: SEAT_HOLD_S
        value: "60"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: NET_SPIKE
        value: "0"
