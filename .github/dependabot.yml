# Dependabot: weekly, grouped PRs. Cee merges patch/minor groups after CI is green.
# Engine-level packages are pinned by ADR: their MAJOR versions are ignored here and are only
# bumped through an ADR in a lead-scheduled wave (docs/handoff/WORKFLOW.md section 7).
# Note: three.js is 0.x, where every minor can break; the pinned three/@types/three pair must move
# together, so only patch updates of them are proposed.
version: 2
updates:
  # ----------------------------------- npm (pnpm workspace) -----------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Ignore majors of engine-level packages (ADR required to change).
    ignore:
      - dependency-name: three
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/three"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: colyseus
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "colyseus*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@colyseus/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "drizzle-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
    groups:
      # Build, lint, test and type tooling. Only dev dependencies are grouped here.
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
      # Everything that ships to players or runs on the server.
      runtime:
        dependency-type: production
        update-types: ["minor", "patch"]

  # ----------------------------------- GitHub Actions -----------------------------------
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
