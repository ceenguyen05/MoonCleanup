# pnpm workspace definition. Every folder below that contains a package.json is a workspace package.
# Package scope: @moon-cleanup/* (workspace-only, never published). See docs/architecture/module-boundaries.md.
packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
  # The Playwright end-to-end package lives at tests/e2e (@moon-cleanup/e2e).
  - "tests/*"

minimumReleaseAgeExclude:
  - "@colyseus/schema@5.0.48"
  - "@turbo/darwin-64@2.11.11"
  - "@turbo/darwin-arm64@2.11.11"
  - "@turbo/linux-64@2.11.11"
  - "@turbo/linux-arm64@2.11.11"
  - "@turbo/windows-64@2.11.11"
  - "@turbo/windows-arm64@2.11.11"
  - prettier@3.10.1
  - turbo@2.11.11

# uWebSockets.js is published only as a git dependency (github:uNetworking/uWebSockets.js#<tag>), and
# apps/server/package.json pins it directly (allowed: direct dependency). @colyseus/uwebsockets-transport@0.18.5
# declares it AGAIN as a sub-dependency (v20.52.0), which pnpm 11 rejects (ERR_PNPM_EXOTIC_SUBDEP) while
# blockExoticSubdeps is true (the default; kept on, there is no per-package allowlist). Removing the transitive
# edge with the scoped "-" override leaves exactly one uWebSockets.js: the directly pinned one, which pnpm's
# default hoisting still exposes to the transport. See docs/agent-reports/M0-W0-T02-devops-engineer.md.
overrides:
  "@colyseus/uwebsockets-transport>uWebSockets.js": "-"

# Dependency lifecycle scripts: pnpm 11 blocks them by default and fails the install (ERR_PNPM_IGNORED_BUILDS)
# until every package with a script is reviewed. M0-W0-T02 reviewed none: the packages below are recorded as
# explicitly NOT built (false) so that no third-party script runs. The designated devops writer reviews a script
# when a task needs it and asks Cee only for a genuine trust decision before flipping it to true (`pnpm approve-builds`); what each script does is listed in
# docs/agent-reports/M0-W0-T02-devops-engineer.md.
allowBuilds:
  esbuild: false
  msgpackr-extract: false
